<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 — Page not found · coolipy</title>
<style>
  :root { --accent: #058; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #222;
    background: #fafafa;
    line-height: 1.5;
    text-align: center;
  }
  .card { padding: 2rem; }
  .code { font-size: 5rem; font-weight: 300; margin: 0; color: var(--accent); }
  h1 { font-size: 1.5rem; font-weight: 500; margin: 0.5rem 0 0; }
  p { color: #555; margin: 0.5rem 0 1.5rem; }
  a {
    display: inline-block;
    color: var(--accent);
    text-decoration: none;
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 0.5rem 1.25rem;
    transition: background 0.15s ease, color 0.15s ease;
  }
  a:hover { background: var(--accent); color: #fff; }
  .brand { font-size: 0.9rem; color: #999; margin-top: 2rem; }
  .brand strong { color: #555; }
</style>
</head>
<body>
  <div class="card">
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/">← Back to coolipy documentation</a>
    <p class="brand"><strong>coolipy</strong> — the (un)official Python client for Coolify</p>
  </div>
</body>
</html>
