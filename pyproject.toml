[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coolipy"
dynamic = ["version"]
description = "Coolipy - the (un)official Python client for Coolify (coolify.io)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Bocchini", email = "gabrielbocchini@gmail.com" }]
maintainers = [{ name = "Gabriel Bocchini", email = "gabrielbocchini@gmail.com" }]
keywords = ["coolify", "rest client", "api client", "async"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pdoc3>=0.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/gbbocchini/coolipy"
Documentation = "https://coolipydocs.gabrielbocchini.com.br/"
Repository = "https://github.com/gbbocchini/coolipy"

[tool.hatch.version]
path = "coolipy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["coolipy"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
