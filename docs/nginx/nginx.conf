# coolipydocs.gabrielbocchini.com.br — complete nginx server block.
#
# Paste the whole thing into Coolify's nginx config. It is deliberately
# self-contained: there is no `include`, so the file you deploy is the file
# that runs.
#
# It is versioned here only so the routing rules stay reviewable next to the
# pages they serve — build_docs.py does NOT copy it into the web root.
#
# The `location = ...` rules map pre-1.0.0 documentation URLs onto the pages
# that replaced them (commit d63143a renamed coolipy.services.coolify_api.* to
# coolipy.resources.*, and coolipy.constants to coolipy.enums). nginx resolves
# exact matches before regexes, so the specific rules always win over the
# catch-alls below them.

server {
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri.html $uri/index.html $uri/index.htm $uri/ =404;
    }

    location /robots.txt {
        root   /usr/share/nginx/html;
        add_header Content-Type text/plain;
        try_files $uri $uri.txt $uri/robots.txt $uri/ /robots.txt =404;
    }

    location /llms.txt {
        root   /usr/share/nginx/html;
        add_header Content-Type text/plain;
        try_files $uri =404;
    }

    location /llms-full.txt {
        root   /usr/share/nginx/html;
        add_header Content-Type text/plain;
        try_files $uri =404;
    }

    location /sitemap.xml {
        root   /usr/share/nginx/html;
        index  sitemap.xml;
        try_files $uri $uri.xml $uri/sitemap.xml $uri/ /sitemap.xml =404;
    }

    # --- legacy URLs -> current pages -------------------------------------

    location = /constants.html {
        return 301 /enums.html;
    }

    location = /models/service.html {
        return 301 /models/services.html;
    }

    # CoolifyAPIResponse became the private coolipy._response.CoolipyAPIResponse,
    # which has no page of its own; the response models now live in common.
    location = /models/coolify_api_response.html {
        return 301 /models/common.html;
    }

    # env_vars / environs / resources were folded into the shared models module.
    location ~ ^/models/(env_vars|environs|resources)[.]html$ {
        return 301 /models/common.html;
    }

    location = /services/index.html {
        return 301 /resources/index.html;
    }

    # The HTTP transport is private now; the public entry point is the client.
    location = /services/http_service.html {
        return 301 /client.html;
    }

    location = /services/coolify_api/applications.html { return 301 /resources/applications.html; }
    location = /services/coolify_api/databases.html    { return 301 /resources/databases.html; }
    location = /services/coolify_api/deployments.html  { return 301 /resources/deployments.html; }
    location = /services/coolify_api/projects.html     { return 301 /resources/projects.html; }
    location = /services/coolify_api/servers.html      { return 301 /resources/servers.html; }
    location = /services/coolify_api/services.html     { return 301 /resources/services.html; }
    location = /services/coolify_api/teams.html        { return 301 /resources/teams.html; }

    # Remaining coolify_api pages with no direct successor (base, private_keys,
    # resources, index) fall back to the resources index.
    location ~ ^/services/coolify_api/ {
        return 301 /resources/index.html;
    }

    # --- spoofed crawler filter -------------------------------------------
    #
    # PetalBot impersonators send a forged User-Agent: they claim
    # "(HTML, like Gecko)" where every genuine browser and the real PetalBot
    # send "(KHTML, like Gecko)". Those requests permute the site's own path
    # vocabulary into tens of thousands of nonexistent URLs and flood the
    # access log.
    #
    # `[(]` is a character class matching a literal "(", so this requires the
    # paren immediately before HTML and cannot match the real "KHTML, like
    # Gecko" string. Writing the paren backslash-escaped instead would depend
    # on how nginx unescapes a quoted string: if nginx dropped the backslash
    # the pattern would degrade to a bare "HTML, like Gecko" and block every
    # real browser. The character class is safe either way, and keeps this
    # file free of backslashes entirely.
    #
    # A bare `return` is one of the two documented-safe uses of `if` in nginx,
    # so there is no `if`-is-evil risk here.
    if ($http_user_agent ~* "[(]HTML, like Gecko") {
        return 403;
    }

    error_page 400 403 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}
